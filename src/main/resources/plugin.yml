name: Kokonut_UI
author: pingpong
description: 에고버스 플러그인
website: https://wiki.egoverse.kr
provides: [CoreUi]
version: '${version}'
main: org.crebs.coreui.CoreUi
api-version: '26.3'
load: POSTWORLD
softdepend: [Kokonut-Core, Kokonut-Mail, Kokonut_HUD, BetterHud]
commands:
  메인메뉴:
    description: 메인 메뉴 열기 (이동·도감·꾸미기·우편함·설정)
    usage: /메인메뉴
    permission: coreui.mainmenu
  도감:
    description: 아이템 도감 열기 (현재 샘플 데이터)
    usage: /도감
    permission: coreui.dex
  coreui:
    description: Opens the CoreUi demo or rebuilds its resource pack
    usage: /coreui demo [light|dark] | /coreui quest [npc <giver> [player]] | /coreui skill | /coreui shop <id> [player] | /coreui reload
permissions:
  coreui.demo:
    default: op
  # Sample data only for now; open to everyone once real collection data is connected.
  coreui.dex:
    default: op
  # Prototype: 이동·꾸미기·설정 are not wired yet.
  coreui.mainmenu:
    default: op
  # Shops from shops.yml: /coreui shop <id> opens one for yourself.
  coreui.shop:
    default: op
  # /coreui shop <id> <player>: open a shop for another player (console / NPC commands).
  coreui.shop.others:
    default: op
  # /coreui quest npc <giver> <player>: open an NPC quest offer for another player (console / NPC commands).
  coreui.quest.others:
    default: op
  coreui.reload:
    default: op
