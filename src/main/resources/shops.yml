# Kokonut_UI 상점 (/coreui shop <id> [플레이어]). 변경 후 /coreui reload.
# mode: buy  = 플레이어가 사는 상점 (재화 차감 → 아이템 지급)
#       sell = 플레이어가 파는 상점 (아이템 회수 → 재화 지급, 이름·인챈트 등이 없는 순수 바닐라 아이템만)
# 상품은 모두 1개 단위로 거래합니다(화면의 수량 = 아이템 개수).
# 상품: item(바닐라 아이템 키), name(표시 이름), price(1개 가격),
#       currency(silver | gold | kokonut — 골드·코코넛은 정수, 실버는 소수 둘째 자리까지), description(최대 2줄 표시)
# NPC에 연결하려면 콘솔 명령으로: coreui shop <id> %player%
shops:
  general:
    name: 에고버스 잡화점
    mode: buy
    products:
      - {item: oak_planks, name: 참나무 판자, price: 0.2, currency: silver, description: [집 짓기의 기본 재료예요.]}
      - {item: stone_bricks, name: 석재 벽돌, price: 0.28, currency: silver, description: [튼튼한 성벽에 어울려요.]}
      - {item: bricks, name: 벽돌, price: 0.75, currency: silver}
      - {item: light_blue_stained_glass_pane, name: 하늘색 유리판, price: 0.5, currency: silver, description: [창문에 쓰는 얇은 유리예요.]}
      - {item: white_wool, name: 흰색 양털, price: 0.6, currency: silver}
      - {item: lantern, name: 랜턴, price: 1, currency: gold, description: [밤길을 밝혀 주는 등불이에요.]}
      - {item: bookshelf, name: 책장, price: 2, currency: gold}
      - {item: iron_pickaxe, name: 철 곡괭이, price: 40, currency: silver, description: [가장 무난한 채굴 도구예요.]}
      - {item: fishing_rod, name: 낚싯대, price: 30, currency: silver, description: [강과 바다에서 물고기를 낚아요.]}
      - {item: diamond_pickaxe, name: 다이아몬드 곡괭이, price: 25, currency: gold, description: [단단한 광석도 빠르게 캐요.]}
      - {item: bread, name: 빵, price: 0.5, currency: silver, description: [든든한 한 끼예요.]}
      - {item: cooked_beef, name: 스테이크, price: 1.25, currency: silver, description: [포만감이 오래가요.]}
      - {item: cake, name: 케이크, price: 2, currency: gold, description: [함께 나눠 먹어요.]}
      - {item: name_tag, name: 이름표, price: 5, currency: kokonut, description: [몹에게 이름을 붙여요.]}
      - {item: totem_of_undying, name: 불사의 토템, price: 30, currency: kokonut, description: [한 번 죽음을 막아 줘요., 장신구 칸에 넣을 수 있어요.]}
      - {item: elytra, name: 겉날개, price: 120, currency: kokonut, description: [하늘을 활공해요.]}
  farm:
    name: 농산물 매입소
    mode: sell
    products:
      - {item: wheat, name: 밀, price: 0.25, currency: silver, description: [가장 흔한 작물이에요.]}
      - {item: carrot, name: 당근, price: 0.28, currency: silver}
      - {item: potato, name: 감자, price: 0.28, currency: silver}
      - {item: beetroot, name: 비트, price: 0.3, currency: silver}
      - {item: pumpkin, name: 호박, price: 1.5, currency: silver}
      - {item: melon_slice, name: 수박 조각, price: 0.15, currency: silver}
      - {item: sugar_cane, name: 사탕수수, price: 0.18, currency: silver}
      - {item: egg, name: 달걀, price: 0.18, currency: silver}
      - {item: cod, name: 대구, price: 0.9, currency: silver, description: [갓 잡은 생선만 받아요.]}
      - {item: salmon, name: 연어, price: 1.1, currency: silver}
      - {item: raw_iron, name: 철 원석, price: 2, currency: silver, description: [제련하지 않은 원석이에요.]}
      - {item: raw_gold, name: 금 원석, price: 4, currency: silver}
