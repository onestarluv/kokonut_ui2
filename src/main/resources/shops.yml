      - {item: lapis_block, name: 청금석 블록, price: 72, currency: silver}
      - {item: diamond_block, name: 다이아몬드 블록, price: 1080, currency: silver}

  # 기획서 6절 물고기. 같은 등급은 같은 가격, 쓰레기는 매입 안 함. 판매 단가 구간 없음.
  # 미스틱은 실버로 매입하지 않고 골드로만 매입.
  fish:
    name: 어시장
    mode: sell
    products:
      - {fish: common, icon: cod, name: 커먼 물고기, price: 1.5, currency: silver, description: [커먼 등급이면 어떤 종이든 받아요.]}
      - {fish: uncommon, icon: salmon, name: 언커먼 물고기, price: 5, currency: silver, description: [언커먼 등급이면 어떤 종이든 받아요.]}
      - {fish: rare, icon: tropical_fish, name: 레어 물고기, price: 12, currency: silver, description: [레어 등급이면 어떤 종이든 받아요.]}
      - {fish: epic, icon: pufferfish, name: 에픽 물고기, price: 30, currency: silver, description: [에픽 등급이면 어떤 종이든 받아요.]}
      - {fish: legendary, icon: heart_of_the_sea, name: 레전더리 물고기, price: 100, currency: silver, description: [레전더리 등급이면 어떤 종이든 받아요.]}
