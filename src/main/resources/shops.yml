      - {item: pink_wool, name: 분홍색 양털, price: 0.5, currency: silver}

  # 기획서 5절 광물. 원석·광물 형태만, 블록은 정확히 9배. 판매 단가 구간 없음.
  # 매입 안 함: 주괴·조각, 섬세한 손길 광석 블록, 숯, 자수정 조각, 네더 석영(피글린 정책 결정 전), 에메랄드.
  mine:
    name: 광물 매입소
    mode: sell
    products:
      - {item: coal, name: 석탄, price: 5, currency: silver}
